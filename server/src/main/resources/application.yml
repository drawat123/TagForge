spring:
  application:
    name: tagforge-server
  datasource:
    url: jdbc:postgresql://localhost:5433/tagforge
    username: tagforge
    password: tagforge
  flyway:
    enabled: true
  jpa:
    hibernate:
      # Flyway owns the schema. `validate` makes Hibernate check the entities
      # against the real tables at startup and refuse to start if they differ.
      ddl-auto: validate
    open-in-view: false

tagforge:
  mqtt:
    broker-url: tcp://localhost:1883
    client-id: tagforge-server
    topic-filter: v1/devices/+/telemetry
    qos: 1
