services:
  postgres:
    image: postgres:16
    container_name: tagforge-postgres
    environment:
      POSTGRES_DB: tagforge
      POSTGRES_USER: tagforge
      POSTGRES_PASSWORD: tagforge
    ports:
      - "5433:5432"
    volumes:
      - tagforge-pgdata:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: tagforge-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  tagforge-pgdata:
